services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ecoair-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ecoair-postgres
    environment:
      POSTGRES_DB: ecoair
      POSTGRES_USER: ecoair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped

  ingestor:
    build: ./ingestor
    container_name: ecoair-ingestor
    environment:
      MQTT_HOST: mosquitto
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped

  api:
    build: ./api
    container_name: ecoair-api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Contacto del responsable para el texto de consentimiento (Ley 1581). Sin valor inventado:
      # si falta, el formulario muestra "contacto no configurado".
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # true solo detras de un proxy (tunel de Cloudflare, Railway): usa CF-Connecting-IP / X-Forwarded-For
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  alerter:
    # Contexto en la raiz para reutilizar api/*.py y ai/*.py sin duplicarlos (ver alerter/Dockerfile).
    build:
      context: .
      dockerfile: alerter/Dockerfile
    container_name: ecoair-alerter
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped

  notifier:
    # Contexto en la raiz para reutilizar api/subscriptions.py (ver notifier/Dockerfile).
    # Solo este servicio tiene las credenciales SMTP y el secreto de los enlaces de baja.
    build:
      context: .
      dockerfile: notifier/Dockerfile
    container_name: ecoair-notifier
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BASE_URL: ${BASE_URL:-}
      SUBSCRIPTION_SECRET: ${SUBSCRIPTION_SECRET:-}
      NOTIFIER_DRY_RUN: ${NOTIFIER_DRY_RUN:-true}
      NOTIFY_ON_CLOSE: ${NOTIFY_ON_CLOSE:-false}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
