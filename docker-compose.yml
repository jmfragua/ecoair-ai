services:
  mosquitto:
    # Configuracion generada al arrancar desde variables (mosquitto/entrypoint.sh).
    # Con MQTT_DEVICE_* y MQTT_INGESTOR_* en .env: autenticacion + ACL. Sin ellas, en local se
    # mantiene el modo anonimo de antes (MQTT_ALLOW_ANONYMOUS=true solo aqui, nunca en Railway).
    build: ./mosquitto
    container_name: ecoair-mosquitto
    environment:
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-}
      MQTT_INGESTOR_USER: ${MQTT_INGESTOR_USER:-}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:-}
      MQTT_ALLOW_ANONYMOUS: ${MQTT_ALLOW_ANONYMOUS:-true}
    ports:
      - "1883:1883"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ecoair-postgres
    environment:
      POSTGRES_DB: ecoair
      POSTGRES_USER: ecoair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped

  ingestor:
    # Contexto en la raiz para copiar shared/ (ver ingestor/Dockerfile).
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: ecoair-ingestor
    environment:
      MQTT_HOST: mosquitto
      # Usuario de solo suscripcion (vacio = sin autenticacion, como antes)
      MQTT_USER: ${MQTT_INGESTOR_USER:-}
      MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped

  api:
    # Contexto en la raiz para copiar shared/ (ver api/Dockerfile).
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ecoair-api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Contacto del responsable para el texto de consentimiento (Ley 1581). Sin valor inventado:
      # si falta, el formulario muestra "contacto no configurado".
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # true solo detras de un proxy (tunel de Cloudflare, Railway): usa CF-Connecting-IP / X-Forwarded-For
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ALERTA_DISPOSITIVO_CAIDO_ACTIVA: ${ALERTA_DISPOSITIVO_CAIDO_ACTIVA:-true}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  alerter:
    # Contexto en la raiz para reutilizar api/*.py y ai/*.py sin duplicarlos (ver alerter/Dockerfile).
    build:
      context: .
      dockerfile: alerter/Dockerfile
    container_name: ecoair-alerter
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # true para la demo: evalua tambien ecoair-sim-01 (sus alertas quedan marcadas [SIMULACIÓN])
      ALERTER_INCLUIR_SIMULADOS: ${ALERTER_INCLUIR_SIMULADOS:-false}
      ALERTA_DISPOSITIVO_CAIDO_ACTIVA: ${ALERTA_DISPOSITIVO_CAIDO_ACTIVA:-true}
      # Capa EXPERIMENTAL de anomalias (Isolation Forest). Solo aplica a dispositivos simulados.
      ANOMALIAS_ACTIVAS: ${ANOMALIAS_ACTIVAS:-false}
    depends_on:
      - postgres
    restart: unless-stopped

  notifier:
    # Contexto en la raiz para reutilizar api/subscriptions.py (ver notifier/Dockerfile).
    # Solo este servicio tiene las credenciales SMTP y el secreto de los enlaces de baja.
    build:
      context: .
      dockerfile: notifier/Dockerfile
    container_name: ecoair-notifier
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Proveedor de correo: smtp (por defecto) o brevo (API HTTP)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      SUBSCRIPTION_SECRET: ${SUBSCRIPTION_SECRET:-}
      NOTIFIER_DRY_RUN: ${NOTIFIER_DRY_RUN:-true}
      NOTIFY_ON_CLOSE: ${NOTIFY_ON_CLOSE:-false}
      # true para la demo: tambien envia correos de alertas simuladas (asunto con [SIMULACIÓN])
      NOTIFIER_INCLUIR_SIMULADOS: ${NOTIFIER_INCLUIR_SIMULADOS:-false}
      ALERTA_DISPOSITIVO_CAIDO_ACTIVA: ${ALERTA_DISPOSITIVO_CAIDO_ACTIVA:-true}
      # Correos de anomalias experimentales: apagados; si se activan, max. 1 por dispositivo cada 6 h
      ANOMALIAS_CORREO: ${ANOMALIAS_CORREO:-false}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
